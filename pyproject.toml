[project]
name = "pacmap-mlx"
version = "0.1.0"
description = "PaCMAP dimensionality reduction in pure MLX for Apple Silicon"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["mlx>=0.20.0", "numpy>=1.24.0"]

[project.urls]
Homepage = "https://github.com/hanxiao/pacmap-mlx"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
